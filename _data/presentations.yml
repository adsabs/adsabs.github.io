  # Source: _includes/_whatsnew/whats-new.md, "August 2026" section, panel
  # "NASA Science Data: Assessing Research Impact with SciX".
  # UNCERTAIN: the repo cites the piece but gives no publication date; it is
  # reported in the August 2026 newsletter, so only the month is claimed here.
  # UNCERTAIN: the exact on-page title is not recorded in this repo. The title
  # below is derived from the URL slug.
  # NOTE: the repo links this at /learn/blog/... (not /blog/...); the repo's own
  # URL is used because it is the one that can be verified from this codebase.
  - title: "Science Explorer for Research Management"
    type: video
    people: Alberto Accomazzi
    venue: NASA Science Data
    eyebrow: NASA Science Data
    date: "2026-08-01"
    date_display: August 2026
    url: https://science.data.nasa.gov/learn/blog/science-explorer-research-management
    url_label: Watch the video
    image: /help/img/whatsnew/WN2608-sciencedata.png
    image_alt: "Slide from the SciX research management tutorial, showing a SciX library used to collect the publications produced by a research program."
    variant: hero
    summary: >
      A recorded tutorial on using SciX libraries to manage research portfolios and
      track research trends: aggregating the papers tied to a mission, dataset,
      facility, or grant, curating them collaboratively, publishing them through
      public libraries and the SciX API, and using citation networks to map
      expertise and identify reviewers.

