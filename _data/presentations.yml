# Talks, posters, workshops, demos, and videos given by the ADS/SciX team.
# Single source of truth for the Presentations page (ADS: /about/documents,
# SciX: /scixabout/presentations), rendered by _includes/_presentations/presentations.md.
#
# Fields:
#   title         - title as presented; keep verbatim wherever it was recorded
#   type          - invited-talk | contributed-talk | poster | workshop | demo |
#                   video | podcast | interview
#   people        - presenter(s), optional
#   venue         - meeting, host, or series; also used as the eyebrow label
#   location      - city / venue, optional
#   date          - QUOTED ISO string (YYYY-MM-DD). Quoted so Liquid does not
#                   time-zone shift it. Used for sorting.
#   date_display  - optional override when only the month or year is known
#   url           - optional link to slides, poster, record, or recording
#   url_label     - optional link text (defaults to a type-appropriate label)
#   blog_slug     - optional ADS/SciX blog post slug that covers the appearance
#   blog_slug_scix - optional override when the SciX copy of that post is filed
#                   under a different slug than the ADS copy
#   image         - optional site-root-relative image path (verified to exist)
#   image_alt     - required whenever image is set
#   eyebrow       - optional override for the eyebrow label (defaults to venue)
#   summary       - one or two sentences of context
#   variant       - hero | featured | (omit for the plain list)
#
# EVERY entry below was taken from content already in this repository. Nothing
# here is invented. Where only a month or a year could be established, date is
# set to the first of that period and date_display carries the honest precision.
# Uncertainties are flagged inline.

# Human-readable label for each type value. The badge CSS uppercases these.
types:
  invited-talk: Invited Talk
  contributed-talk: Contributed Talk
  poster: Poster
  workshop: Workshop
  demo: Demo
  video: Video
  podcast: Podcast
  interview: Interview

