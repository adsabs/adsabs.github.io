  # publication days, hence date_precision: month.
  - title: "Deep Earth map reveals lost U.S. continent"
    outlet: Science
    url: https://www.science.org/content/article/deep-earth-map-reveals-lost-u-s-continent
    date: 2026-05-01
    date_precision: month
    kind: coverage
    about: team
    person: Anna Kelbert
    description: "Science reports on work led by SciX project scientist for Earth science Anna Kelbert, mapping ancient continental fragments beneath North America."
    variant: featured
    outlet_tier: 1
    image: /help/img/media/science-mt-array.jpg
    image_alt: >-
      Magnetotelluric array map of the continental United States, the figure
      supplied for Science's coverage of the conductivity survey.

