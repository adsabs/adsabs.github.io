# Press releases, coverage, and media mentions for SciX, ADS, and team members.
# Single source of truth for the press coverage rail on blog posts and for the Media page.
#
# Fields:
#   title          - headline as published
#   outlet         - publication or institution
#   outlet_short   - optional; short form used for the eyebrow label and the
#                    "As Featured In" wordmark row when `outlet` is long
#   url            - link to the piece
#   date           - publication date (YYYY-MM-DD)
#   date_precision - optional; day (default) | month | year. Controls how much of
#                    the date is displayed, so we never imply precision we do not
#                    have. Sorting always uses the full date.
#   kind           - press-release | coverage
#   about          - scix | ads | team
#   person         - optional; team member name when the piece is about an individual
#   description    - optional; one-line summary shown on the Media page
#   variant        - hero | featured | compact. Controls prominence in the Media
#                    page card grid; compact items appear in the full list only.
#   outlet_tier    - optional; 1 | 2. Tier 1 outlets render larger in the
#                    "As Featured In" wordmark row.
#   sets           - optional; blog-post rails this item should appear in
#   image          - hero image from the published article (team-supplied)
#   image_alt      - descriptive alt text for that image
#
# Every URL in this file was taken from content that already lives in this
# repository. Nothing here is reconstructed from memory. Where a published
# headline could not be read directly from the citing page, the title is derived
# from the target URL's own slug and flagged with a comment.

coverage:
  # The CfA and NASA pieces are launch-day announcements; exact publication
  # dates still to be confirmed.
  - title: "New NASA-Backed Research Platform SciX Expands Open Science"
    outlet: "Center for Astrophysics | Harvard & Smithsonian"
    outlet_short: "Center for Astrophysics"
    url: https://www.cfa.harvard.edu/news/new-nasa-backed-research-platform-scix-expands-open-science
    date: 2025-09-29
    date_precision: month
    kind: press-release
    about: scix
    description: "The Center for Astrophysics announces the public launch of the Science Explorer, extending open access to the literature of every NASA science division."
    variant: hero
    outlet_tier: 1
    image: /help/img/media/cfa-scix-launch.jpg
    image_alt: >-
      Science Explorer launch graphic used in the Center for Astrophysics
      announcement: a dark field of Earth and space imagery with the SciX name.
    sets:
      - scix-launch

  - title: "SciX: A New Era for NASA Research Discovery"
    outlet: NASA Science Data Portal
    url: https://science.data.nasa.gov/features-events/scix-launch
    date: 2025-09-29
    date_precision: month
    kind: press-release
    about: scix
    description: "NASA's Science Data Portal introduces SciX to the agency's research community as a single entry point to Earth and space science literature, data, and software."
    variant: featured
    outlet_tier: 1
    image: /help/img/media/nasa-scix-launch.jpg
    image_alt: >-
      Social card from NASA's Science Data Portal SciX launch story, using the
      SciX artwork supplied for the announcement.
    sets:
      - scix-launch

  - title: "UAE-raised astrophysicist helps build NASA's new portal for Earth and space research"
    outlet: The National
    url: https://www.thenationalnews.com/future/space/2025/09/30/uae-raised-astrophysicist-helps-build-nasas-new-portal-for-earth-and-space-research/
    date: 2025-09-30
    kind: coverage
    about: team
    person: Mugdha Polimera
    description: "A profile of SciX back-end developer and astrophysicist Mugdha Polimera and her route from the UAE to building NASA's new discovery platform."
    variant: featured
    outlet_tier: 1
    image: /help/img/media/national-polimera.jpg
    image_alt: >-
      Portrait of Mugdha Polimera used in The National profile, supplied by the
      author.
    sets:
      - scix-launch

  # Coverage of Anna Kelbert's continental conductivity mapping. All three links
